name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure gradlew executable & Setup Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Installing Gradle Wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for CI build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon || true

      - name: Locate and Rename Debug APK
        id: locate_apk
        run: |
          mkdir -p output_apks
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output_apks/BT-Keyboard-Mouse-debug.apk
            echo "APK generated successfully at output_apks/BT-Keyboard-Mouse-debug.apk"
          else
            echo "ERROR: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BT-Keyboard-Mouse-debug-apk
          path: output_apks/BT-Keyboard-Mouse-debug.apk
          retention-days: 14

      - name: Build Release APK (Unsigned)
        run: |
          ./gradlew assembleRelease -x validateSigningRelease --stacktrace --no-daemon || true
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output_apks/BT-Keyboard-Mouse-release-unsigned.apk
          fi

      - name: Upload Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BT-Keyboard-Mouse-release-apk
          path: output_apks/*release*.apk
          if-no-files-found: ignore
          retention-days: 14
